; platmon config. Every value here is the built-in default; delete what you don't change.
; Usage: python3 platmon.py platmon.ini   (usually run by scripts/systemd or scripts/docker)

[core]
; seconds between collections (0.1 to 3600); every frontend reads the latest one
interval = 1.0

[network]
; per-interface counters and rates of this process's network namespace (docs/network.md);
; no: not collected. Measured cost on: about 0.16-0.18 % of one core at a 1 s interval
; (docs/performance/budget.md)
enabled = yes

[disk_io]
; read/write counters and rates of each physical disk of the host (docs/disk-io.md); no: not collected
enabled = yes

[storage]
; partitions and capacity of local disk filesystems, observed every interval seconds (5 to 3600) and
; served at /api/observations (docs/storage.md); on by default
enabled = yes
interval = 30

[wifi]
; signal of the connected wireless interfaces from /proc/net/wireless, observed every interval seconds
; (1 to 3600) and served at /api/observations (docs/wifi.md); passive, no scan; on by default
enabled = yes
interval = 5

[probe]
; enabled by default; idle without targets: TCP connect time to the listed targets only, one attempt each per interval,
; one after another (docs/probe.md). Not ICMP ping. targets: IP literals, address:port, comma-separated,
; at most 4, e.g. 192.0.2.10:443, [2001:db8::1]:22. interval must exceed timeout × number of targets.
enabled = yes
interval = 10
timeout = 2
targets =

[history]
; the last retention seconds (60 to 3600) of CPU, memory, temperature, network and disk I/O numbers,
; in memory only, at /api/history and in the web page's graphs (docs/history.md); on by default
enabled = yes
retention = 600

[pressure]
; pressure stall information from /proc/pressure where the kernel provides it (docs/pressure.md);
; on by default
enabled = yes

[http]
; JSON API at /api/stats
enabled = yes
bind = 0.0.0.0
port = 9797
; no: serve only the API, not the web viewer at /
web = yes
