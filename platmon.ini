; platmon config. Every value here is the built-in default; delete what you don't change.
; Usage: python3 platmon.py platmon.ini   (--frontends http,terminal overrides enabled=)

[core]
; seconds between collections (0.1 to 3600); every frontend reads the latest one
interval = 1.0

[http]
; JSON API at /api/stats
enabled = yes
bind = 0.0.0.0
port = 8080
; no: serve only the API, not the web viewer at /
web = yes

[terminal]
; draw on this process's terminal; skipped with a warning when there is none (e.g. under systemd)
enabled = no
