<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>platmon</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1d2127; --muted: #6b7280; --track: #e5e7eb; --bar: #2f7d5b; --warn: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1c1f24; --fg: #e6e8eb; --muted: #9aa1ab; --track: #2c3037; --bar: #4fb286; --warn: #f0883e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  section { background: var(--card); border-radius: 8px; padding: 12px 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; align-items: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); transition: width .3s; }
  .fill.hot { background: var(--warn); }
  .kv { display: flex; justify-content: space-between; margin: 3px 0; font-variant-numeric: tabular-nums; }
  #err { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1 id="model">platmon</h1>
  <div class="muted" id="meta"></div>
  <div class="muted" id="sys"></div>
  <div class="muted" id="age"></div>
  <div id="err"></div>
</header>
<div class="grid">
  <section><h2>CPU</h2><div id="cpu"></div></section>
  <section><h2>GPU · Memory · Disk</h2><div id="res"></div></section>
  <section><h2>Temperature</h2><div id="temp"></div></section>
  <section><h2>Power · Fan</h2><div id="pwr"></div></section>
</div>
<script>
const $ = id => document.getElementById(id);
const gib = b => (b / 2 ** 30).toFixed(1) + 'G';
const row = (label, pct, text) =>
  `<div class="row"><span>${label}</span><div class="track"><div class="fill${pct > 85 ? ' hot' : ''}" style="width:${Math.min(pct, 100)}%"></div></div><span>${text}</span></div>`;
// system entries are listed as they come, so board-specific ones (e.g. Jetson's l4t) need no change here
const SYSTEM_LABELS = {os: '', kernel: 'kernel ', arch: '', hostname: 'host ', l4t: 'L4T '};
const systemLine = sys => Object.entries(sys || {}).filter(([, v]) => v)
  .map(([k, v]) => (k in SYSTEM_LABELS ? SYSTEM_LABELS[k] : k + ' ') + v).join(' · ');
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;

function render(s) {
  const up = Math.floor(s.uptime);
  $('model').textContent = s.model;
  $('meta').textContent = `${s.platform} · ${s.power_mode ? 'mode ' + s.power_mode + ' · ' : ''}up ${Math.floor(up / 86400)}d ${String(Math.floor(up % 86400 / 3600)).padStart(2, '0')}:${String(Math.floor(up % 3600 / 60)).padStart(2, '0')}`;
  $('sys').textContent = systemLine(s.system);
  $('cpu').innerHTML = s.cpu.map(c => row('CPU' + c.id, c.usage, c.usage.toFixed(1) + '%' + (c.freq ? ` ${(c.freq / 1e6).toFixed(0)}MHz` : ''))).join('');
  const m = s.memory, d = s.disk, g = s.gpu;
  $('res').innerHTML =
    (g ? row('GPU', g.usage, g.usage.toFixed(1) + '%' + (g.freq ? ` ${(g.freq / 1e6).toFixed(0)}MHz` : '')) : '') +
    row('RAM', 100 * m.used / m.total, `${gib(m.used)}/${gib(m.total)}`) +
    (m.swap_total ? row('SWAP', 100 * m.swap_used / m.swap_total, `${gib(m.swap_used)}/${gib(m.swap_total)}`) : '') +
    row('DISK', 100 * d.used / d.total, `${gib(d.used)}/${gib(d.total)}`);
  $('temp').innerHTML = Object.entries(s.temperature).map(([k, v]) => kv(k, v.toFixed(1) + ' °C')).join('');
  $('pwr').innerHTML = Object.entries(s.power).map(([k, v]) => kv(k, v.toFixed(2) + ' W')).join('') +
    s.fans.map(f => kv('Fan ' + f.name, ([f.rpm !== null && f.rpm + ' rpm', f.percent !== null && f.percent + '%'].filter(Boolean).join(' · ') || 'n/a'))).join('');
  document.querySelectorAll('section').forEach(sec => sec.hidden = !sec.lastElementChild.innerHTML);
}

const TIMEOUT_MS = 5000;  // a request that hangs must not stop the updates
// What is on screen and how old it is. The age comes from the server (data_age_ms) plus browser time since
// that answer arrived (performance.now, so the device and browser clocks never get compared); it ignores
// transfer time. A repeated 200 for the same sample keeps counting from the server's age, never from 0.
// Older servers send no sample metadata: then only the time since their last answer is known.
let shown = null;       // {kind: 'sample' | 'legacy' | 'invalid', seq, ageMs, t0}
let failing = false;    // the last request failed: what is shown is the last good data, not current
let checking = false;   // tab came back: browser time may have stopped while hidden, wait for a new answer
let inflight = false, refresh = null;

function sampleOf(s, t0) {
  if (!('schema_version' in s) && !('sample' in s)) return {kind: 'legacy', t0};
  const m = s.sample;
  const ok = s.schema_version === 1 && m && typeof m === 'object' && typeof m.instance_id === 'string'
    && Number.isInteger(m.sequence) && m.sequence > 0 && Number.isFinite(m.data_age_ms) && m.data_age_ms >= 0;
  return ok ? {kind: 'sample', seq: m.sequence, ageMs: m.data_age_ms, t0} : {kind: 'invalid', t0};
}

function showAge() {
  if (!shown) { $('age').textContent = ''; return; }
  const since = performance.now() - shown.t0;
  const secs = ms => Math.round(ms / 1000) + ' s';
  const text = shown.kind === 'sample' ? `sample #${shown.seq} · data age ${secs(shown.ageMs + since)}`
    : `response received ${secs(since)} ago · ` + (shown.kind === 'legacy'
      ? 'this server reports no sample age' : 'sample age unavailable (invalid metadata)');
  const line = failing ? 'last good: ' + text + ' (not current)' : checking ? 'checking… last seen: ' + text : text;
  $('age').textContent = line[0].toUpperCase() + line.slice(1);
}

// One request at a time; whatever happens, the next one is scheduled. On failure the last good values
// stay on screen with their age, and the message says what failed.
async function tick() {
  clearTimeout(refresh);
  inflight = true;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  let stage = 'connect';
  try {
    const r = await fetch('api/stats', {signal: ctl.signal, cache: 'no-store'});
    if (r.status === 503) throw new Error('No current data: platmon is running but has no recent sample (see its log)');
    if (!r.ok) throw new Error(`platmon answered ${r.status} ${r.statusText}`);
    stage = 'read';
    const s = await r.json();
    const t0 = performance.now();
    stage = 'render';
    render(s);
    shown = sampleOf(s, t0);
    failing = checking = false;
    $('err').textContent = '';
  } catch (e) {
    failing = true;  // shown keeps its own age: a failure does not make old data newer
    checking = false;
    $('err').textContent = e.name === 'AbortError' ? `No answer within ${TIMEOUT_MS / 1000} s`
      : stage === 'connect' && e instanceof TypeError ? 'Connection lost: ' + e.message
      : stage === 'read' ? 'Unexpected response (not platmon data)'
      : e.message;
  } finally {
    clearTimeout(timer);
    inflight = false;
    refresh = setTimeout(tick, 1000);
    showAge();
  }
}
setInterval(showAge, 1000);  // the age keeps moving while a request hangs
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checking = true;
  showAge();
  if (!inflight) tick();  // the running request, if any, brings the new answer
});
tick();
</script>
</body>
</html>
