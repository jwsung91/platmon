<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>platmon</title>
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1d2127; --muted: #6b7280; --track: #e5e7eb; --bar: #2f7d5b; --warn: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1c1f24; --fg: #e6e8eb; --muted: #9aa1ab; --track: #2c3037; --bar: #4fb286; --warn: #f0883e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { margin-bottom: 16px; }
  .brand { display: block; margin-bottom: 12px; }
  .brand img { display: block; width: 220px; max-width: 100%; height: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  section { background: var(--card); border-radius: 8px; padding: 12px 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .row { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; align-items: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); transition: width .3s; }
  .fill.hot { background: var(--warn); }
  .spark { display: block; width: 100%; height: 28px; }
  .spark path { fill: none; stroke: var(--bar); stroke-width: 1.5; }
  .kv span:first-child { overflow-wrap: anywhere; min-width: 0; margin-right: 8px; }
  .kv { display: flex; justify-content: space-between; margin: 3px 0; font-variant-numeric: tabular-nums; }
  #err, #coll { color: var(--warn); }
</style>
</head>
<body>
<header>
  <picture class="brand">
    <source media="(prefers-color-scheme: dark)" srcset="assets/brand/platmon-logo-dark.svg">
    <img src="assets/brand/platmon-logo-light.svg" alt="platmon" width="220" height="63">
  </picture>
  <h1 id="model">Platform status</h1>
  <div class="muted" id="meta"></div>
  <div class="muted" id="sys"></div>
  <div class="muted" id="age"></div>
  <div id="coll"></div>
  <div id="err"></div>
</header>
<div class="grid">
  <section><h2>CPU</h2><div id="cpu"></div></section>
  <section><h2>GPU · Memory · Disk</h2><div id="res"></div></section>
  <section><h2>Temperature</h2><div id="temp"></div></section>
  <section><h2>Power · Fan</h2><div id="pwr"></div></section>
  <section><h2>Network</h2><div id="net"></div></section>
  <section><h2>Disk I/O</h2><div id="dio"></div></section>
  <section><h2>Storage</h2><div id="sto"></div></section>
  <section><h2>Wi-Fi</h2><div id="wifi"></div></section>
  <section><h2>TCP connect</h2><div id="probe"></div></section>
  <section><h2>History</h2><div id="hist"></div></section>
  <section><h2>Pressure</h2><div id="psi"></div></section>
</div>
<script>
const $ = id => document.getElementById(id);
const gib = b => (b / 2 ** 30).toFixed(1) + 'G';
const row = (label, pct, text) =>
  `<div class="row"><span>${label}</span><div class="track"><div class="fill${pct > 85 ? ' hot' : ''}" style="width:${Math.min(pct, 100)}%"></div></div><span>${text}</span></div>`;
// system entries are listed as they come, so board-specific ones (e.g. Jetson's l4t) need no change here
const SYSTEM_LABELS = {os: '', kernel: 'kernel ', arch: '', hostname: 'host ', l4t: 'L4T '};
const systemLine = sys => Object.entries(sys || {}).filter(([, v]) => v)
  .map(([k, v]) => (k in SYSTEM_LABELS ? SYSTEM_LABELS[k] : k + ' ') + v).join(' · ');
const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
// why CPU rows are missing: the service compares /proc/stat readings, so the first one has none (same as cli.py)
const CPU_REASONS = {warmup: 'warming up', counter_regressed: 'counter went backwards', no_ticks: 'no ticks counted',
  invalid_interval: 'invalid interval', gap: 'restarting after a gap'};
function cpuNote(s) {
  const groups = {};
  for (const u of (s.cpu_sampling && s.cpu_sampling.unavailable) || [])
    (groups[CPU_REASONS[u.reason] || u.reason] ||= []).push('CPU' + u.id);
  const whys = Object.keys(groups);
  if (!whys.length) return '';
  return 'CPU sampling: ' + (!s.cpu.length && whys.length === 1 ? whys[0]
    : whys.map(why => groups[why].join(' ') + ' ' + why).join('; '));
}

// network interfaces and disks with the rates the server computed (same wording as cli.py); a counter
// without a rate says why, it is never shown as 0. I/O time is the share of the window with I/O in flight.
const RATE_REASONS = {warmup: 'warming up', gap: 'restarting after a gap', counter_regressed: 'counter went backwards',
  invalid_interval: 'invalid interval', identity_unavailable: 'identity unknown', namespace_changed: 'namespace changed'};
const perS = v => {
  let i = 0;
  while (Math.abs(v) >= 1024 && i < 3) { v /= 1024; i++; }
  return (i ? v.toFixed(1) : v.toFixed(0)) + ' ' + ['B/s', 'KiB/s', 'MiB/s', 'GiB/s'][i];
};
const windowText = x => Number.isFinite(x.window_ms) ? ` · window ${(x.window_ms / 1000).toFixed(3)} s` : '';
const why = x => esc(RATE_REASONS[x.reason] || x.reason);
const listOf = (obj, key) => obj && Array.isArray(obj[key]) ? obj[key] : [];
function netRows(s) {
  const items = listOf(s.network, 'interfaces');
  return items.length ? '<div class="muted">bytes/s · this process\'s network namespace</div>' + items.map(i => {
    const r = i.rates, bad = ['errors', 'dropped'].filter(k => i.rx[k] || i.tx[k]).map(k => `${k} ${i.rx[k]}/${i.tx[k]}`);
    return kv(esc(i.name), r ? `rx ${perS(r.rx_bytes_per_s)} · tx ${perS(r.tx_bytes_per_s)}` : why(i)) +
      (r ? `<div class="muted">rx ${r.rx_packets_per_s.toFixed(1)} · tx ${r.tx_packets_per_s.toFixed(1)} packets/s${windowText(i)}</div>` : '') +
      (bad.length ? `<div class="muted">${bad.join(' · ')} (rx/tx, total)</div>` : '');
  }).join('') : '';
}
function diskRows(s) {
  const items = listOf(s.disk_io, 'disks');
  return items.map(d => {
    const r = d.rates;
    return kv(esc(d.name), r ? `read ${perS(r.read_bytes_per_s)} · write ${perS(r.write_bytes_per_s)}` : why(d)) +
      (r ? `<div class="muted">reads ${r.reads_per_s.toFixed(1)}/s · writes ${r.writes_per_s.toFixed(1)}/s · I/O time ${(100 * r.io_time_ratio).toFixed(1)}%` +
        windowText(d) + '</div>' : '') +
      (d.in_flight != null ? `<div class="muted">in flight ${d.in_flight}</div>` : '');
  }).join('');
}

// Low-frequency groups (/api/observations) change on their own cadence: asked for at most every 10 s, only
// while the page is visible, on the same 1 s timer as the age line; an older server (404) is not asked again.
// Their age is the server's data_age_ms plus browser time since that answer, like the sample age.
let obs = null, obsAt = 0, obsAsked = -Infinity, obsSupported = true, obsRequest = null;
async function pollObs() {
  const now = performance.now();
  if (obsRequest || !obsSupported || document.visibilityState !== 'visible' || now - obsAsked < 10000) return;
  obsAsked = now;
  const ctl = obsRequest = new AbortController(), mine = epoch;
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch('api/observations', {signal: ctl.signal, cache: 'no-store'});
    const body = r.ok ? await r.json() : null;
    if (mine !== epoch || ctl.signal.aborted) return;
    if (r.status === 404) { obsSupported = false; obs = null; }
    else if (r.ok) { obs = body; obsAt = performance.now(); }
    else obs = null;
  } catch (e) { if (mine === epoch) obs = null; } finally {
    clearTimeout(timer); obsRequest = null;
  }  // the main view goes on without it
  $('sto').innerHTML = storageRows();
  $('wifi').innerHTML = wifiRows();
  $('probe').innerHTML = probeRows();
  hideEmptyPanels();
}
function observationStale(g) {
  const o = g.observation;
  return o.stale || (Number.isFinite(g.stale_after_ms) && o.data_age_ms + performance.now() - obsAt > g.stale_after_ms);
}
// TCP connect time to the configured targets (not ICMP ping): the latest attempt, and recent failures
function probeRows() {
  const g = obs && obs.groups && obs.groups.probe, o = g && g.observation, d = g && g.data;
  const items = d && Array.isArray(d.targets) ? d.targets : [];
  if (!o || !items.length) return '';
  const age = Math.round((o.data_age_ms + performance.now() - obsAt) / 1000);
  return `<div class="muted">observed ${age} s ago${observationStale(g) ? ' (not current)' : ''}</div>` + items.map(t =>
    kv(esc(t.address.includes(':') ? `[${t.address}]:${t.port}` : `${t.address}:${t.port}`),
      (t.connect_ms != null ? t.connect_ms.toFixed(1) + ' ms' : esc(t.reason)) + ` · failed ${t.failures}/${t.attempts}`)).join('');
}
// the signal while connected, never the last one after; a value without dBm is shown without a unit
function wifiRows() {
  const g = obs && obs.groups && obs.groups.wifi, o = g && g.observation, d = g && g.data;
  const items = d && Array.isArray(d.interfaces) ? d.interfaces : [];
  if (!o || !items.length) return '';
  const age = Math.round((o.data_age_ms + performance.now() - obsAt) / 1000);
  return `<div class="muted">observed ${age} s ago${observationStale(g) ? ' (not current)' : ''}</div>` + items.map(i => kv(esc(i.name),
    i.connected !== true ? (i.connected === false ? 'not connected' : esc(i.connection_state || 'unknown')) : i.signal_dbm != null ? i.signal_dbm + ' dBm'
      : i.signal_raw != null ? `signal ${i.signal_raw} (unit not reported)` : 'signal n/a') +
    (i.connected && i.link_quality != null ? `<div class="muted">link quality ${i.link_quality}</div>` : '')).join('');
}
function storageRows() {
  const g = obs && obs.groups && obs.groups.storage, o = g && g.observation, d = g && g.data;
  if (!o || !d) return '';
  const age = Math.round((o.data_age_ms + performance.now() - obsAt) / 1000);
  const fss = Array.isArray(d.filesystems) ? d.filesystems : [], parts = Array.isArray(d.partitions) ? d.partitions : [];
  return `<div class="muted">observed ${age} s ago${observationStale(g) ? ' (not current)' : ''}</div>` +
    fss.map(f => kv(esc(f.mount_points[0].path + (f.mount_points[0].read_only ? ' (ro)' : '') +
        (f.mount_points.length > 1 ? ` +${f.mount_points.length - 1} more` : '')),
      f.total_bytes != null ? `${gib(f.used_bytes)}/${gib(f.total_bytes)} · ${gib(f.available_bytes)} free` : 'capacity unknown') +
      `<div class="muted">${esc(f.fstype)} · ${esc(f.device || f.major + ':' + f.minor)}</div>`).join('') +
    parts.map(p => kv(esc(p.name), `${gib(p.size_bytes)} · ${p.mount_points.length ? esc(p.mount_points[0] +
      (p.mount_points.length > 1 ? ` +${p.mount_points.length - 1} more` : '')) : 'not mounted'}`)).join('');
}

// Recent history (/api/history, off unless the service enables it): asked for at most every 10 s while
// visible, never again after a 404. A null is a gap in the line (warmup, missing sample), never 0.
let hist = null, histAt = 0, histAsked = -Infinity, histSupported = true, histRequest = null;
const HIST_LABEL = [[/^cpu\/(\d+)\/usage$/, m => 'CPU' + m[1]],
  [/^observation\/storage\/([^/]+)\/[^/]+\/(used_bytes|available_bytes)$/, m => `FS ${m[1]} ${m[2] === 'used_bytes' ? 'used' : 'free'}`],
  [/^observation\/wifi\/[^/]+\/\d+\/([^/]+)\/signal_dbm$/, m => `${m[1]} signal`],
  [/^observation\/probe\/([^/]+)\/connect_ms$/, m => `TCP ${m[1]}`],
  [/^memory\/used_bytes$/, () => 'RAM used'],
  [/^temperature\/(?:name:)?(.+)$/, m => 'temp ' + m[1].slice(0, 12)],
  [/^network\/[^/]+\/\d+\/([^/]+)\/(rx|tx)_bytes_per_s$/, m => `${m[1]} ${m[2]}`],
  [/^disk_io\/[^/]+\/([^/]+)\/(read|write)_bytes_per_s$/, m => `${m[1]} ${m[2]}`]];
function spark(points) {
  const vs = points.map(p => p[2]).filter(v => v != null), lo = Math.min(...vs), hi = Math.max(...vs);
  if (!vs.length) return '';
  const oldest = points[0][1], newest = points[points.length - 1][1];
  const y = v => hi > lo ? 26 - 24 * (v - lo) / (hi - lo) : 14;
  let d = '', pen = false;
  points.forEach((p, i) => {
    if (p[2] == null) { pen = false; return; }
    d += `${pen ? 'L' : 'M'}${(oldest > newest ? 200 * (oldest - p[1]) / (oldest - newest) : 0).toFixed(1)},${y(p[2]).toFixed(1)}`;
    pen = true;
  });
  return `<svg class="spark" viewBox="0 0 200 28" preserveAspectRatio="none"><path d="${d}"/></svg>`;
}
function histRows() {
  const series = hist && hist.series && typeof hist.series === 'object' ? hist.series : {};
  const rows = [];
  for (const [id, points] of Object.entries(series)) {
    const rule = HIST_LABEL.find(([re]) => re.test(id));
    if (!rule || !Array.isArray(points) || !points.length || rows.length >= 12) continue;
    const latest = points[points.length - 1], last = latest[2];
    rows.push(kv(esc(rule[1](id.match(rule[0]))), last == null ? 'no value' : id.startsWith('temperature') ? last.toFixed(1) + ' °C'
      : id.startsWith('cpu/') ? last.toFixed(1) + '%' : id.includes('/wifi/') ? last.toFixed(1) + ' dBm'
      : id.includes('/probe/') ? last.toFixed(1) + ' ms' : id.startsWith('memory') || id.includes('/storage/') ? gib(last) : perS(last)) +
      `<div class="muted">latest point ${Math.round((latest[1] + performance.now() - histAt) / 1000)} s ago</div>` + spark(points));
  }
  return rows.length ? `<div class="muted">last ${Math.round(hist.retention_s / 60)} min</div>` + rows.join('') +
    (Object.keys(series).filter(id => HIST_LABEL.some(([re]) => re.test(id))).length > rows.length
      ? `<div class="muted">more series in /api/history (showing first ${rows.length})</div>` : '') : '';
}
async function pollHist() {
  const now = performance.now();
  if (histRequest || !histSupported || document.visibilityState !== 'visible' || now - histAsked < 10000) return;
  histAsked = now;
  const ctl = histRequest = new AbortController(), mine = epoch;
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch('api/history?points=120', {signal: ctl.signal, cache: 'no-store'});
    const body = r.ok ? await r.json() : null;
    if (mine !== epoch || ctl.signal.aborted) return;
    if (r.status === 404) { histSupported = false; hist = null; }
    else if (r.ok) { hist = body; histAt = performance.now(); }
    else hist = null;
  } catch (e) { if (mine === epoch) hist = null; } finally {
    clearTimeout(timer); histRequest = null;
  }
  $('hist').innerHTML = histRows();
  hideEmptyPanels();
}

// pressure stall information: the kernel's 10 s averages of the share of time tasks were stalled (not usage)
function psiRows(s) {
  const res = s.pressure && s.pressure.resources && typeof s.pressure.resources === 'object' ? s.pressure.resources : {};
  const rows = Object.entries(res).map(([name, r]) => kv(esc(name), `some ${r.some.avg10.toFixed(1)}%` + (r.full ? ` · full ${r.full.avg10.toFixed(1)}%` : '')));
  return rows.length ? '<div class="muted">avg10 · share of time stalled</div>' + rows.join('') : '';
}

// optional groups that could not read everything, as in cli.py; nothing for absent sensors or older servers
function collectionNote(s) {
  const c = s.collectors && typeof s.collectors === 'object' ? s.collectors : {};
  const bad = Object.entries(c).filter(([name, v]) => name !== 'core' && v && (v.state === 'partial' || v.state === 'error'))
    .map(([name, v]) => name + ' ' + v.state);
  return bad.length ? 'Collection: ' + bad.join(', ') : '';
}

function hideEmptyPanels() {
  document.querySelectorAll('section').forEach(sec => sec.hidden = !sec.lastElementChild.innerHTML);
}

function render(s) {
  const up = Math.floor(s.uptime);
  $('model').textContent = s.model;
  $('meta').textContent = `${s.platform} · ${s.power_mode ? 'mode ' + s.power_mode + ' · ' : ''}up ${Math.floor(up / 86400)}d ${String(Math.floor(up % 86400 / 3600)).padStart(2, '0')}:${String(Math.floor(up % 3600 / 60)).padStart(2, '0')}`;
  $('sys').textContent = systemLine(s.system);
  $('coll').textContent = collectionNote(s);
  const note = cpuNote(s);
  $('cpu').innerHTML = s.cpu.map(c => row('CPU' + c.id, c.usage, c.usage.toFixed(1) + '%' + (c.freq ? ` ${(c.freq / 1e6).toFixed(0)}MHz` : ''))).join('') +
    (note ? `<div class="muted">${esc(note)}</div>` : '');
  const m = s.memory, d = s.disk, g = s.gpu;
  $('res').innerHTML =
    (g ? row('GPU', g.usage, g.usage.toFixed(1) + '%' + (g.freq ? ` ${(g.freq / 1e6).toFixed(0)}MHz` : '')) : '') +
    row('RAM', 100 * m.used / m.total, `${gib(m.used)}/${gib(m.total)}`) +
    (m.swap_total ? row('SWAP', 100 * m.swap_used / m.swap_total, `${gib(m.swap_used)}/${gib(m.swap_total)}`) : '') +
    row('DISK', 100 * d.used / d.total, `${gib(d.used)}/${gib(d.total)}`);
  $('temp').innerHTML = Object.entries(s.temperature).map(([k, v]) => kv(esc(k), v.toFixed(1) + ' °C')).join('');
  $('pwr').innerHTML = Object.entries(s.power).map(([k, v]) => kv(esc(k), v.toFixed(2) + ' W')).join('') +
    s.fans.map(f => kv('Fan ' + esc(f.name), ([f.rpm !== null && f.rpm + ' rpm', f.percent !== null && f.percent + '%'].filter(Boolean).join(' · ') || 'n/a'))).join('');
  $('net').innerHTML = netRows(s);
  $('dio').innerHTML = diskRows(s);
  $('psi').innerHTML = psiRows(s);
  hideEmptyPanels();
}

const TIMEOUT_MS = 5000;  // a request that hangs must not stop the updates
// What is on screen and how old it is. The age comes from the server (data_age_ms) plus browser time since
// that answer arrived (performance.now, so the device and browser clocks never get compared); it ignores
// transfer time. A repeated 200 for the same sample keeps counting from the server's age, never from 0.
// Older servers send no sample metadata: then only the time since their last answer is known.
let shown = null;       // {kind: 'sample' | 'legacy' | 'invalid', seq, ageMs, t0}
let failing = false;    // the last request failed: what is shown is the last good data, not current
let checking = false;   // tab came back: browser time may have stopped while hidden, wait for a new answer
let inflight = null, refresh = null;  // inflight: the running request's AbortController
let epoch = 0;          // counts tab returns: an answer to a request started before the latest one proves nothing

function sampleOf(s, t0) {
  if (!('schema_version' in s) && !('sample' in s)) return {kind: 'legacy', t0};
  const m = s.sample;
  const ok = s.schema_version === 1 && m && typeof m === 'object' && typeof m.instance_id === 'string'
    && Number.isInteger(m.sequence) && m.sequence > 0 && Number.isFinite(m.data_age_ms) && m.data_age_ms >= 0;
  return ok ? {kind: 'sample', seq: m.sequence, ageMs: m.data_age_ms, t0} : {kind: 'invalid', t0};
}

function showAge() {
  if (!shown) { $('age').textContent = ''; return; }
  const since = performance.now() - shown.t0;
  const secs = ms => Math.round(ms / 1000) + ' s';
  const text = shown.kind === 'sample' ? `sample #${shown.seq} · data age ${secs(shown.ageMs + since)}`
    : `response received ${secs(since)} ago · ` + (shown.kind === 'legacy'
      ? 'this server reports no sample age' : 'sample age unavailable (invalid metadata)');
  const line = failing ? 'last good: ' + text + ' (not current)' : checking ? 'checking… last seen: ' + text : text;
  $('age').textContent = line[0].toUpperCase() + line.slice(1);
}

// One request at a time; whatever happens, the next one is scheduled. On failure the last good values
// stay on screen with their age, and the message says what failed.
async function tick() {
  clearTimeout(refresh);
  const ctl = inflight = new AbortController(), mine = epoch;
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  let stage = 'connect';
  try {
    const r = await fetch('api/stats', {signal: ctl.signal, cache: 'no-store'});
    if (r.status === 503) throw new Error('No current data: platmon is running but has no recent sample (see its log)');
    if (!r.ok) throw new Error(`platmon answered ${r.status} ${r.statusText}`);
    stage = 'read';
    const s = await r.json();
    const t0 = performance.now();
    if (mine !== epoch) return;  // started before the tab came back: drop it, finally asks again
    stage = 'render';
    render(s);
    shown = sampleOf(s, t0);
    failing = checking = false;
    $('err').textContent = '';
  } catch (e) {
    if (mine !== epoch) return;
    failing = true;  // shown keeps its own age: a failure does not make old data newer
    checking = false;
    $('err').textContent = e.name === 'AbortError' ? `No answer within ${TIMEOUT_MS / 1000} s`
      : stage === 'connect' && e instanceof TypeError ? 'Connection lost: ' + e.message
      : stage === 'read' ? 'Unexpected response (not platmon data)'
      : e.message;
  } finally {
    clearTimeout(timer);
    inflight = null;
    refresh = setTimeout(tick, mine === epoch ? 1000 : 0);
    showAge();
  }
}
setInterval(() => {
  showAge(); pollObs(); pollHist();
  if (document.visibilityState !== 'visible') return;
  if (obs) { $('sto').innerHTML = storageRows(); $('wifi').innerHTML = wifiRows(); $('probe').innerHTML = probeRows(); }
  if (hist) $('hist').innerHTML = histRows();
}, 1000);  // ages keep moving while a request hangs
pollObs();
pollHist();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  epoch++;
  if (obsRequest) obsRequest.abort();
  if (histRequest) histRequest.abort();
  obs = hist = null;
  obsAsked = histAsked = -Infinity;
  for (const id of ['sto', 'wifi', 'probe', 'hist']) $(id).innerHTML = '';
  hideEmptyPanels();
  checking = true;
  showAge();
  if (inflight) inflight.abort();  // its answer would not count; its finally starts the new request
  else tick();
});
tick();
</script>
</body>
</html>
